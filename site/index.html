<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kbingers — Korean TV all day, everyday. All free.</title>
  <meta name="description" content="The Only 24/7 Premium Korean content FAST/AVOD Streaming Platform. K-dramas, K-movies, K-pop, variety and K-food. All free." />

  <!-- ⚠️ 모든 CDN 은 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원). -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>

  <script>
    // ========================================
    // Tailwind theme extension — Kbingers design tokens
    // ========================================
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lime: '#D3F47C',
            live: '#F03838',
            grey10: '#F2F2F2',
            grey40: '#ADADAE',
            grey60: '#707071',
            grey75: '#3C3C3D',
            grey80: '#2D2D2E',
            grey90: '#10160E',
            bg: '#10160E',
          },
          fontFamily: {
            sans: ['Pretendard', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    html { scroll-behavior: smooth; }
    body { background:#10160E; color:#fff; font-family:'Pretendard',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }

    /* Headings baseline */
    .kb-display { font-weight:800; letter-spacing:-0.02em; text-transform:uppercase; line-height:1.02; }

    /* ---- Infinite marquees ---- */
    @keyframes kb-scroll-left  { from { transform: translateX(0); }    to { transform: translateX(-50%); } }
    @keyframes kb-scroll-right { from { transform: translateX(-50%); } to { transform: translateX(0); } }
    .kb-marquee-track { display:flex; width:max-content; will-change:transform; }
    .kb-anim-left  { animation: kb-scroll-left  var(--dur,40s) linear infinite; }
    .kb-anim-right { animation: kb-scroll-right var(--dur,40s) linear infinite; }
    .kb-marquee:hover .kb-anim-left,
    .kb-marquee:hover .kb-anim-right { animation-play-state: paused; }
    @media (prefers-reduced-motion: reduce) {
      .kb-anim-left, .kb-anim-right { animation: none; }
    }

    /* ---- FAQ accordion ---- */
    .kb-acc-body { display:grid; grid-template-rows:0fr; transition:grid-template-rows .35s ease; }
    .kb-acc-body.open { grid-template-rows:1fr; }
    .kb-acc-inner { overflow:hidden; }

    /* Focus ring */
    :focus-visible { outline:2px solid #D3F47C; outline-offset:2px; border-radius:6px; }

    /* Fade-up on scroll */
    .kb-reveal { opacity:0; transform:translateY(24px); transition:opacity .6s ease, transform .6s ease; }
    .kb-reveal.kb-in { opacity:1; transform:none; }

    /* Custom scrollbar hidden for grids */
    .kb-noscroll::-webkit-scrollbar { display:none; }
    .kb-noscroll { -ms-overflow-style:none; scrollbar-width:none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // React hooks
    // ========================================
    const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

    // ========================================
    // 🎨 DESIGN SYSTEM COMPONENTS
    // ========================================

    // Small lime uppercase section-label pill
    function SectionLabel({ children, className = '' }) {
      return (
        <span className={`inline-block rounded-full bg-lime/15 px-4 py-1.5 text-[11px] font-extrabold uppercase tracking-[0.18em] text-lime ${className}`}>
          {children}
        </span>
      );
    }

    // Rounded pill button
    function Button({ variant = 'primary', size = 'md', className = '', children, ...rest }) {
      const base = 'inline-flex items-center justify-center gap-2 rounded-full font-semibold transition-all duration-200 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed';
      const sizes = {
        sm: 'px-4 py-2 text-sm',
        md: 'px-6 py-3 text-sm md:text-base',
        lg: 'px-8 py-4 text-base',
      };
      const variants = {
        primary: 'bg-lime text-grey90 shadow-lg shadow-lime/20 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-lime/30 active:translate-y-0 active:scale-[0.98]',
        outline: 'border border-white/25 bg-white/[0.02] text-white backdrop-blur-sm hover:-translate-y-0.5 hover:border-white/60 hover:bg-white/[0.06]',
        ghost: 'text-white/80 hover:text-white',
        dark: 'bg-grey80 text-white border border-white/10 hover:bg-grey75 hover:-translate-y-0.5',
      };
      return (
        <button className={`${base} ${sizes[size]} ${variants[variant]} ${className}`} {...rest}>
          {children}
        </button>
      );
    }

    // Card wrapper
    function Card({ className = '', children, ...rest }) {
      return (
        <div className={`rounded-3xl ${className}`} {...rest}>{children}</div>
      );
    }

    // LIVE badge
    function LiveBadge() {
      return (
        <span className="inline-flex items-center gap-1 rounded-md bg-live px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-wide text-white">
          <span className="h-1.5 w-1.5 rounded-full bg-white animate-pulse" /> Live
        </span>
      );
    }

    // Reveal-on-scroll wrapper
    function Reveal({ as: Tag = 'div', className = '', children, ...rest }) {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { el.classList.add('kb-in'); obs.unobserve(el); } });
        }, { threshold: 0.12 });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      return <Tag ref={ref} className={`kb-reveal ${className}`} {...rest}>{children}</Tag>;
    }

    // Section container with consistent max width + padding
    function Section({ id, className = '', children }) {
      return (
        <section id={id} className={`mx-auto w-full max-w-6xl px-5 sm:px-8 ${className}`}>
          {children}
        </section>
      );
    }

    // Infinite marquee for wordmarks/logos
    function LogoMarquee({ items, dur = '35s' }) {
      const doubled = [...items, ...items];
      return (
        <div className="kb-marquee relative overflow-hidden" aria-hidden="true">
          <div className="kb-marquee-track kb-anim-left" style={{ '--dur': dur }}>
            {doubled.map((label, i) => (
              <span key={i} className="mx-8 select-none whitespace-nowrap text-lg font-extrabold uppercase tracking-wide text-grey60 sm:text-xl">
                {label}
              </span>
            ))}
          </div>
        </div>
      );
    }

    // ========================================
    // Data
    // ========================================
    const PLATFORM_LOGOS = ['SAMSUNG', 'LG', 'Roku', 'fire tv', 'VIZIO', 'Google TV'];

    // Gradient palette for content thumbnails
    const GRAD = {
      purple: 'linear-gradient(135deg,#3b1a63,#7b2ff7,#d3f47c22)',
      sky:    'linear-gradient(135deg,#1b3a5c,#2f80c9,#7fd0ff33)',
      rose:   'linear-gradient(135deg,#5c1b3a,#c9407e,#ffd0e033)',
      slate:  'linear-gradient(135deg,#1c2b26,#3c4c44,#d3f47c22)',
      amber:  'linear-gradient(135deg,#5c3a1b,#c98b2f,#ffe6b033)',
      teal:   'linear-gradient(135deg,#123a36,#1f8a7a,#7ffce033)',
      indigo: 'linear-gradient(135deg,#1a2363,#4a52d6,#c9d0ff33)',
      green:  'linear-gradient(135deg,#12401f,#2f9d4a,#c9ffd033)',
    };

    const ROW1 = [
      { title: 'NEW KPOP', sub: 'First and Only 24/7 K-Pop', grad: GRAD.purple, live: true },
      { title: 'WAIKIKI 2', sub: 'Variety · Comedy', grad: GRAD.amber },
      { title: 'Boys Over Flowers', sub: 'Classic K-Drama', grad: GRAD.rose },
      { title: 'The Good Detective', sub: 'Crime · Thriller', grad: GRAD.slate },
    ];
    const ROW2 = [
      { title: 'JTBC News', sub: 'Live News Channel', grad: GRAD.indigo, live: true },
      { title: 'Missing Crown Prince', sub: 'Historical Romance', grad: GRAD.teal },
      { title: 'NEW KMOVIES', sub: '24/7 Korean Films', grad: GRAD.purple },
      { title: 'When the Weather Is Fine', sub: 'Healing Drama', grad: GRAD.sky },
    ];
    const ROW3 = [
      { title: 'NEW KFOOD', sub: '24/7 Korean Food', grad: GRAD.green },
      { title: 'WEEKLY IDOL', sub: 'K-Pop Variety', grad: GRAD.rose },
      { title: 'K-ASMR', sub: 'Relax & Unwind', grad: GRAD.teal },
      { title: 'THE PACKAGE', sub: 'Romance · Travel', grad: GRAD.amber },
    ];

    const FAQS = [
      { q: 'What is Kbingers?', a: 'Kbingers is a 24/7 premium Korean-content FAST/AVOD streaming platform. Enjoy K-dramas, K-movies, K-pop, variety shows and K-food across live curated channels and an on-demand library — Korean TV all day, everyday, all free.' },
      { q: 'Is Kbingers really free?', a: 'Yes. Kbingers is 100% free. There is no subscription, no signup and no credit card required. The service is ad-supported (FAST/AVOD), so you can start watching instantly at no cost.' },
      { q: 'Where is Kbingers available?', a: 'Kbingers is available across major connected-TV platforms and streaming devices in supported regions, including Samsung TV, LG TV, Roku, Amazon Fire TV, VIZIO and Google TV.' },
      { q: 'Where can I watch Kbingers?', a: 'You can watch on your Smart TV or streaming device through the Kbingers app, or from any browser at bingekorea.tv. Pick a live channel to lean back, or browse on demand to choose exactly what you want.' },
      { q: 'How do I download Kbingers?', a: 'Search "Kbingers" in your TV platform’s app store (Samsung, LG, Roku, Fire TV, VIZIO or Google TV) and install it — or use 1-Click Install to send the app straight to your TV from your phone in minutes.' },
      { q: 'How do I save my favorite content?', a: 'Browse the on-demand library and add titles to your favorites to build a personal watchlist. Your picks are kept handy so you can jump back into a show or movie anytime.' },
      { q: 'Contact Us', a: 'Need help or have a partnership inquiry? Reach out to NEW ID Co., Ltd. through the contact channels on bingekorea.tv or our social accounts — we are always here to help.' },
    ];

    // ========================================
    // 🧩 LAYOUT — Header
    // ========================================
    const NAV_LINKS = [
      { label: 'NEW ID', href: '#newid' },
      { label: 'How to watch', href: '#how-to-watch' },
      { label: 'Channels', href: '#channels' },
      { label: 'Services', href: '#service' },
      { label: 'FAQ', href: '#faq' },
    ];

    function Wordmark({ className = '' }) {
      return (
        <a href="#top" className={`font-extrabold italic tracking-tight ${className}`} aria-label="Kbingers home">
          <span className="text-lime">K</span><span className="text-white">bingers</span>
        </a>
      );
    }

    function Header() {
      const [scrolled, setScrolled] = useState(false);
      const [open, setOpen] = useState(false);
      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 20);
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return (
        <header className={`fixed inset-x-0 top-0 z-50 transition-colors duration-300 ${scrolled ? 'bg-grey90/85 backdrop-blur-md border-b border-white/5' : 'bg-transparent'}`}>
          <nav className="mx-auto flex max-w-6xl items-center justify-between px-5 py-4 sm:px-8">
            <a href="#top" aria-label="Kbingers home" className="inline-flex items-center">
              <img src="../Logo.png" alt="Kbingers" className="h-7 w-auto sm:h-8" />
            </a>
            <div className="hidden items-center gap-8 md:flex">
              {NAV_LINKS.map((l) => (
                <a key={l.label} href={l.href} className="text-sm font-medium text-grey10/90 transition-colors hover:text-lime">
                  {l.label}
                </a>
              ))}
            </div>
            <button
              className="md:hidden text-white"
              aria-label="Toggle menu"
              aria-expanded={open}
              onClick={() => setOpen((v) => !v)}
            >
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                {open ? <><path d="M6 6l12 12" /><path d="M18 6L6 18" /></> : <><path d="M4 7h16" /><path d="M4 12h16" /><path d="M4 17h16" /></>}
              </svg>
            </button>
          </nav>
          {open && (
            <div className="md:hidden border-t border-white/10 bg-grey90/95 backdrop-blur-md">
              <div className="flex flex-col px-5 py-3">
                {NAV_LINKS.map((l) => (
                  <a key={l.label} href={l.href} onClick={() => setOpen(false)}
                     className="py-3 text-sm font-medium text-grey10/90 hover:text-lime">
                    {l.label}
                  </a>
                ))}
              </div>
            </div>
          )}
        </header>
      );
    }

    // ========================================
    // 📄 Hero
    // ========================================
    // ⭐ App-store rating badge (laurel style)
    function RatingBadge() {
      return (
        <div className="inline-flex flex-col items-center gap-1 lg:items-start">
          <span className="text-[11px] font-medium uppercase tracking-[0.15em] text-grey40">★ Download on App Store</span>
          <div className="flex items-center gap-2">
            <span className="text-base leading-none text-lime tracking-tight">★★★★★</span>
            <span className="text-sm font-bold text-white">4.7</span>
          </div>
        </div>
      );
    }

    // Hero right-side TV showing the Kbingers app UI
    function HeroTV() {
      return (
        <div className="relative mx-auto w-full max-w-xl">
          <div className="aspect-video overflow-hidden rounded-xl border-2 border-white/15 bg-grey90 shadow-2xl">
            <div className="flex h-full flex-col p-2.5 text-[7px] sm:p-3.5 sm:text-[9px]">
              {/* top nav */}
              <div className="flex items-center gap-3 pb-2">
                <span className="font-extrabold italic"><span className="text-lime">K</span><span className="text-white">bingers</span></span>
                <div className="ml-1 flex gap-2.5 text-white/50">
                  <span className="text-white">Home</span><span>Live TV</span><span>Movies</span><span>Series</span><span>K-Pop</span>
                </div>
              </div>
              {/* hero banner */}
              <div className="relative flex-1 overflow-hidden rounded-md" style={{ background: 'linear-gradient(120deg,#241243,#7b2ff7 55%,#c9407e)' }}>
                <div className="absolute inset-0" style={{ background: 'linear-gradient(90deg, rgba(0,0,0,0.55), transparent 60%)' }} />
                <div className="absolute bottom-2 left-2.5">
                  <p className="font-extrabold text-white sm:text-[12px]">My Dearest</p>
                  <p className="text-white/70">Korean Drama · Romance</p>
                  <span className="mt-1 inline-block rounded-full bg-lime px-2 py-0.5 font-bold text-grey90">▶ Watch Now</span>
                </div>
              </div>
              {/* Live TV row */}
              <div className="mt-2">
                <div className="mb-1 flex justify-between text-white/60"><span className="font-semibold text-white">Live TV</span><span>See All</span></div>
                <div className="grid grid-cols-6 gap-1">
                  {[GRAD.purple,GRAD.rose,GRAD.amber,GRAD.sky,GRAD.teal,GRAD.indigo].map((g,i)=>(
                    <div key={i} className="aspect-video rounded-[3px]" style={{ background:g }} />
                  ))}
                </div>
              </div>
              {/* Popular row */}
              <div className="mt-1.5">
                <div className="mb-1 font-semibold text-white/80">Popular on Kbingers</div>
                <div className="grid grid-cols-6 gap-1">
                  {[GRAD.green,GRAD.slate,GRAD.indigo,GRAD.purple,GRAD.amber,GRAD.teal].map((g,i)=>(
                    <div key={i} className="aspect-video rounded-[3px]" style={{ background:g }} />
                  ))}
                </div>
              </div>
            </div>
          </div>
          {/* stand */}
          <div className="mx-auto h-4 w-16 bg-white/10" style={{ clipPath:'polygon(32% 0,68% 0,100% 100%,0 100%)' }} />
          <div className="mx-auto h-1 w-28 rounded-full bg-white/10" />
        </div>
      );
    }

    function Hero() {
      return (
        <Section id="top" className="pt-28 pb-14 sm:pt-36">
          <div className="grid items-center gap-10 lg:grid-cols-2">
            {/* Left — copy */}
            <Reveal className="text-center lg:text-left">
              <div className="flex justify-center lg:justify-start"><RatingBadge /></div>
              <h1 className="mt-6 text-4xl font-extrabold leading-[1.05] tracking-tight text-white sm:text-6xl lg:text-[64px]">
                Stream<br /> K-Content<br /> for FREE<br /> on your TV
              </h1>
              <p className="mx-auto mt-6 max-w-md text-sm text-grey40 sm:text-base lg:mx-0">
                Enjoy Korean dramas, movies, variety shows, and K-pop — all in one place.
              </p>
              <div className="mt-8 flex flex-wrap items-center justify-center gap-x-6 gap-y-3 lg:justify-start">
                {PLATFORM_LOGOS.map((p) => (
                  <span key={p} className="text-sm font-extrabold uppercase tracking-wide text-grey60">{p}</span>
                ))}
              </div>
            </Reveal>
            {/* Right — TV mock */}
            <Reveal className="mt-2 lg:mt-0">
              <HeroTV />
            </Reveal>
          </div>
        </Section>
      );
    }

    // ========================================
    // 📄 NEW SECTION — 1-Click Install
    // ========================================
    // Realistic phone bezel — notch + home indicator, matches TV frame language
    function PhoneMock() {
      return (
        <div className="relative mx-auto h-36 w-[72px] shrink-0 rounded-[20px] border-[3px] border-grey90 bg-grey90 p-1 shadow-xl">
          <span className="absolute left-1/2 top-1.5 z-10 h-1 w-6 -translate-x-1/2 rounded-full bg-black/50" aria-hidden="true" />
          <div className="flex h-full flex-col items-center justify-center gap-2 rounded-[15px] bg-gradient-to-b from-grey80 to-grey90">
            <div className="flex h-7 w-7 items-center justify-center rounded-md bg-lime/20 text-xs font-black text-lime">K</div>
            <span className="text-[7px] font-semibold text-grey40">Kbingers</span>
            <span className="rounded-full bg-lime px-3 py-1 text-[8px] font-bold text-grey90">Install</span>
          </div>
          <span className="absolute bottom-1 left-1/2 h-0.5 w-8 -translate-x-1/2 rounded-full bg-white/15" aria-hidden="true" />
        </div>
      );
    }
    // TV bezel + stand — same frame language as the Hero TV mock
    function TvMock({ children }) {
      return (
        <div className="mx-auto w-[168px] shrink-0">
          <div className="aspect-video w-full rounded-md border-[3px] border-grey90 bg-grey90 p-2.5 shadow-xl">
            {children}
          </div>
          <div className="mx-auto mt-1 h-2.5 w-7 bg-grey90/70" style={{ clipPath: 'polygon(30% 0,70% 0,100% 100%,0 100%)' }} />
          <div className="mx-auto h-1 w-20 rounded-full bg-grey90/40" />
        </div>
      );
    }

    // Device mock + numbered label side-by-side (stacked on mobile)
    function InstallStep({ n, title, caption, children }) {
      return (
        <div className="flex flex-1 flex-col items-center gap-4 text-center sm:flex-row sm:items-center sm:gap-5 sm:text-left">
          {children}
          <div className="flex flex-col items-center gap-1.5 sm:items-start">
            <div className="flex items-center gap-2.5">
              <span className="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[#2f6bff] text-xs font-black text-white">
                {n}
              </span>
              <h3 className="text-sm font-extrabold uppercase tracking-wide text-grey90">{title}</h3>
            </div>
            <p className="max-w-[14rem] text-xs leading-relaxed text-grey60">{caption}</p>
          </div>
        </div>
      );
    }

    function Connector() {
      return (
        <div className="hidden shrink-0 items-center justify-center px-1 md:flex" aria-hidden="true">
          <div className="h-px w-8 border-t-2 border-dashed border-grey90/25" />
          <span className="ml-1 text-grey60">→</span>
        </div>
      );
    }

    function InstallButton({ label, chip, style, className = '' }) {
      return (
        <button className={`group flex items-center justify-between gap-3 rounded-full px-6 py-3.5 text-sm font-bold transition-transform duration-200 hover:-translate-y-0.5 ${className}`} style={style}>
          <span className="flex items-center gap-2">
            {chip}
            {label}
          </span>
          <span className="opacity-70 transition-transform group-hover:translate-x-1">›</span>
        </button>
      );
    }

    function OneClickInstall() {
      return (
        <Section id="install" className="py-20 sm:py-28">
          <div className="rounded-[32px] bg-grey10 px-6 py-12 text-grey90 sm:px-12 sm:py-14">
            {/* heading — centered, full width */}
            <Reveal className="mx-auto max-w-xl text-center">
              <span className="inline-block rounded-full bg-[#2f6bff]/10 px-4 py-1.5 text-[11px] font-extrabold uppercase tracking-[0.18em] text-[#2f6bff]">1-Click Install</span>
              <h2 className="mt-4 text-2xl font-extrabold leading-tight text-grey90 sm:text-[28px]">
                Install on your TV in 3 simple steps
              </h2>
              <p className="mt-3 text-sm text-grey60">Get Kbingers on your TV from your phone in minutes.</p>
            </Reveal>

            {/* 3-step flow — full width row */}
            <Reveal className="mt-12 flex flex-col items-stretch gap-8 md:flex-row md:items-center md:justify-between md:gap-2">
              <InstallStep n="1" title="Tap Install" caption="휴대폰에서 설치 버튼을 클릭하세요.">
                <PhoneMock />
              </InstallStep>
              <Connector />
              <InstallStep n="2" title="Confirm Account" caption="TV와 연결된 계정을 확인하세요.">
                <TvMock>
                  <div className="flex h-full flex-col justify-center gap-1.5">
                    <span className="text-[8px] font-semibold text-grey40">Confirm your account</span>
                    <span className="truncate rounded bg-grey80 px-2 py-1 text-[9px] text-white">amy.kim@email.com</span>
                    <span className="mt-1 self-start rounded-full bg-lime px-3 py-1 text-[8px] font-bold text-grey90">Confirm</span>
                  </div>
                </TvMock>
              </InstallStep>
              <Connector />
              <InstallStep n="3" title="Start Watching" caption="TV에 앱이 자동으로 설치되고 바로 시청을 시작하세요.">
                <TvMock>
                  <div className="flex h-full flex-col items-center justify-center gap-2 text-center">
                    <span className="flex h-8 w-8 items-center justify-center rounded-full bg-lime text-sm font-black text-grey90">✓</span>
                    <span className="text-[9px] font-bold text-white">Installation Complete!</span>
                  </div>
                </TvMock>
              </InstallStep>
            </Reveal>

            {/* Platform install buttons */}
            <Reveal className="mt-12 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">
              <InstallButton
                label="Install on Roku"
                className="text-white"
                style={{ background: '#6f1ab1' }}
                chip={<span className="text-xs font-black italic">R</span>}
              />
              <InstallButton
                label="Install on Fire TV"
                className="text-grey90"
                style={{ background: '#ff9900' }}
                chip={<span className="text-xs font-black">▷</span>}
              />
              <InstallButton
                label="Samsung TV"
                className="border border-grey90/15 bg-white text-grey90 shadow-sm"
                chip={<span className="text-xs font-extrabold">S</span>}
              />
              <InstallButton
                label="LG TV"
                className="border border-grey90/15 bg-white text-grey90 shadow-sm"
                chip={<span className="text-xs font-extrabold text-[#a50034]">LG</span>}
              />
            </Reveal>
          </div>
        </Section>
      );
    }

    // ========================================
    // 📄 How to Watch — SEE YOU ON TV
    // ========================================
    function HowToWatch() {
      const [playing, setPlaying] = useState(false);
      return (
        <Section id="how-to-watch" className="py-20 text-center sm:py-28">
          <Reveal>
            <SectionLabel>How to watch</SectionLabel>
            <h2 className="kb-display mt-5 text-3xl text-white sm:text-5xl">See you on TV</h2>
          </Reveal>

          {/* Video player placeholder */}
          <Reveal className="mt-10">
            <div className="relative mx-auto aspect-video w-full max-w-3xl overflow-hidden rounded-2xl border border-white/10"
                 style={{ background: 'linear-gradient(135deg,#241243,#5b1f9e 55%,#2a3f6b)' }}
                 role="img" aria-label="Kbingers video player showing a K-pop performance">
              <div className="pointer-events-none absolute inset-0" style={{ background: 'radial-gradient(70% 60% at 50% 40%, rgba(211,244,124,0.12), transparent)' }} />
              <button
                onClick={() => setPlaying((v) => !v)}
                className="absolute left-1/2 top-1/2 flex h-16 w-16 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-white/20 text-2xl text-white backdrop-blur transition hover:scale-110 hover:bg-white/30"
                aria-label={playing ? 'Pause video' : 'Play video'}
              >
                {playing ? '❚❚' : '▶'}
              </button>
              {/* progress bar */}
              <div className="absolute inset-x-4 bottom-4">
                <div className="flex items-center gap-3">
                  <span className="text-[11px] font-medium text-white/80">01:24</span>
                  <div className="h-1 flex-1 overflow-hidden rounded-full bg-white/25">
                    <div className="h-full rounded-full bg-lime transition-all" style={{ width: playing ? '48%' : '32%' }} />
                  </div>
                  <span className="text-[11px] font-medium text-white/60">03:57</span>
                </div>
              </div>
            </div>
          </Reveal>

          {/* Platform pill buttons */}
          <Reveal className="mt-10 flex flex-wrap items-center justify-center gap-3">
            {PLATFORM_LOGOS.map((p) => (
              <span key={p} className="rounded-full border border-white/25 px-5 py-2.5 text-sm font-extrabold text-white transition hover:border-lime hover:text-lime">
                {p}
              </span>
            ))}
          </Reveal>
        </Section>
      );
    }

    // ========================================
    // 📄 Content grid — auto-scrolling rows
    // ========================================
    function ContentCard({ item }) {
      return (
        <div className="group relative mx-2 h-32 w-56 shrink-0 overflow-hidden rounded-xl sm:h-40 sm:w-72"
             style={{ background: item.grad }}>
          <div className="absolute inset-0 bg-black/10 transition group-hover:bg-black/0" />
          {item.live && <div className="absolute right-2 top-2"><LiveBadge /></div>}
          <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/70 to-transparent p-3">
            <p className="text-sm font-extrabold uppercase leading-tight text-white drop-shadow sm:text-base">{item.title}</p>
            <p className="mt-0.5 text-[10px] font-medium text-white/70 sm:text-xs">{item.sub}</p>
          </div>
        </div>
      );
    }

    function ContentRow({ items, direction = 'left', dur = '45s' }) {
      const doubled = [...items, ...items, ...items, ...items];
      const anim = direction === 'left' ? 'kb-anim-left' : 'kb-anim-right';
      return (
        <div className="kb-marquee relative overflow-hidden py-2">
          <div className={`kb-marquee-track ${anim}`} style={{ '--dur': dur }}>
            {doubled.map((it, i) => <ContentCard key={i} item={it} />)}
          </div>
        </div>
      );
    }

    function ContentGrid() {
      return (
        <section id="channels" className="py-10">
          <div className="flex flex-col gap-2">
            <ContentRow items={ROW1} direction="left" dur="48s" />
            <ContentRow items={ROW2} direction="right" dur="55s" />
            <ContentRow items={ROW3} direction="left" dur="50s" />
          </div>
        </section>
      );
    }

    // ========================================
    // 📄 Service
    // ========================================
    // Small fake channel-UI screenshot placeholder
    function ChannelUIMock() {
      return (
        <div className="aspect-video w-full overflow-hidden rounded-xl border border-white/10 bg-grey90 p-2">
          <div className="flex h-full gap-2">
            <div className="hidden w-10 shrink-0 flex-col gap-1.5 sm:flex">
              {[0,1,2,3,4].map(i => <div key={i} className={`h-6 rounded ${i===1?'bg-lime/70':'bg-grey75'}`} />)}
            </div>
            <div className="flex flex-1 flex-col gap-1.5">
              <div className="h-1/2 rounded" style={{ background: GRAD.purple }} />
              <div className="grid flex-1 grid-cols-4 gap-1.5">
                {[GRAD.rose,GRAD.sky,GRAD.amber,GRAD.teal].map((g,i)=>(
                  <div key={i} className="rounded" style={{ background: g }} />
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }
    // On-demand thumbnail placeholder
    function OnDemandMock() {
      return (
        <div className="aspect-video w-full overflow-hidden rounded-xl border border-black/10 bg-grey90 p-2">
          <div className="relative mb-1.5 h-1/2 w-full rounded" style={{ background: GRAD.slate }}>
            <span className="absolute bottom-1.5 left-2 text-xs font-extrabold uppercase text-white/90">The Royal Tailor</span>
          </div>
          <div className="grid grid-cols-4 gap-1.5" style={{ height: '42%' }}>
            {[GRAD.rose,GRAD.indigo,GRAD.amber,GRAD.teal].map((g,i)=>(
              <div key={i} className="rounded" style={{ background: g }} />
            ))}
          </div>
        </div>
      );
    }

    function Service() {
      return (
        <Section id="service" className="py-20 text-center sm:py-28">
          <Reveal>
            <SectionLabel>Service</SectionLabel>
            <h2 className="kb-display mx-auto mt-5 max-w-3xl text-3xl text-white sm:text-5xl">
              All genres of Korean content now streaming all day!
            </h2>
          </Reveal>

          <div className="mt-14 flex flex-col gap-6">
            {/* Channel — dark card */}
            <Reveal>
              <Card className="border border-white/10 bg-grey80 p-6 sm:p-10">
                <div className="grid items-center gap-8 md:grid-cols-2">
                  <ChannelUIMock />
                  <div className="text-left">
                    <h3 className="text-2xl font-extrabold text-white">Channel</h3>
                    <p className="mt-4 text-sm leading-relaxed text-grey40">
                      Kbingers provides a curated environment for viewers to indulge in a variety of K-content genres with 24/7 live streaming, tailored to their preferences. It offers an optimized user experience (UX/UI) for easy content discovery across genres, comprehensive and individual IP channels. In addition to genre-based channels, viewers can binge-watch their desired content on a per-IP basis, maximizing their viewing pleasure.
                    </p>
                  </div>
                </div>
              </Card>
            </Reveal>

            {/* On Demand — light card */}
            <Reveal>
              <Card className="bg-grey10 p-6 text-grey90 sm:p-10">
                <div className="grid items-center gap-8 md:grid-cols-2">
                  <div className="text-left">
                    <h3 className="text-2xl font-extrabold text-grey90">On Demand</h3>
                    <p className="mt-4 text-sm leading-relaxed text-grey60">
                      Kbingers provides a convenient service that allows users to select and watch their favorite K-content for free at any time. It offers the flexibility to enjoy a wide variety of Korean genres and topics. The intuitive user interface and search functions make it easy to find specific programs or movies, creating a more seamless viewing experience for users.
                    </p>
                  </div>
                  <OnDemandMock />
                </div>
              </Card>
            </Reveal>
          </div>
        </Section>
      );
    }

    // ========================================
    // 📄 FAQ — accordion
    // ========================================
    function FaqItem({ item, isOpen, onToggle, index }) {
      const btnId = `faq-btn-${index}`;
      const panelId = `faq-panel-${index}`;
      return (
        <div className="overflow-hidden rounded-xl border border-white/10 bg-grey80/60">
          <button
            id={btnId}
            aria-expanded={isOpen}
            aria-controls={panelId}
            onClick={onToggle}
            className="flex w-full items-center justify-between gap-4 px-5 py-4 text-left transition hover:bg-white/[0.03]"
          >
            <span className="text-sm font-semibold text-white sm:text-base">{item.q}</span>
            <span className={`text-xl leading-none text-lime transition-transform duration-300 ${isOpen ? 'rotate-45' : ''}`} aria-hidden="true">+</span>
          </button>
          <div id={panelId} role="region" aria-labelledby={btnId} className={`kb-acc-body ${isOpen ? 'open' : ''}`}>
            <div className="kb-acc-inner">
              <p className="px-5 pb-5 text-sm leading-relaxed text-grey40">{item.a}</p>
            </div>
          </div>
        </div>
      );
    }

    function Faq() {
      const [openSet, setOpenSet] = useState(() => new Set([0]));
      const toggle = (i) => setOpenSet((prev) => {
        const next = new Set(prev);
        next.has(i) ? next.delete(i) : next.add(i);
        return next;
      });
      return (
        <Section id="faq" className="py-20 sm:py-28">
          <Reveal className="text-center">
            <SectionLabel>FAQ</SectionLabel>
            <h2 className="kb-display mx-auto mt-5 max-w-xl text-3xl text-white sm:text-5xl">
              Questions? We're always here to help
            </h2>
          </Reveal>
          <Reveal className="mx-auto mt-12 flex max-w-3xl flex-col gap-3">
            {FAQS.map((item, i) => (
              <FaqItem key={i} index={i} item={item} isOpen={openSet.has(i)} onToggle={() => toggle(i)} />
            ))}
          </Reveal>
        </Section>
      );
    }

    // ========================================
    // 🧩 Footer
    // ========================================
    function SocialIcon({ label, children, href = '#' }) {
      return (
        <a href={href} aria-label={label} className="flex h-9 w-9 items-center justify-center rounded-full border border-white/15 text-white/80 transition hover:border-lime hover:text-lime">
          {children}
        </a>
      );
    }

    function Footer() {
      return (
        <footer id="newid" className="border-t border-white/10 py-12">
          <Section>
            <div className="flex flex-col items-center gap-6 text-center md:flex-row md:items-start md:justify-between md:text-left">
              <div>
                <Wordmark className="text-xl" />
                <div className="mt-4 flex justify-center gap-3 md:justify-start">
                  <SocialIcon label="X (Twitter)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.66l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                  </SocialIcon>
                  <SocialIcon label="TikTok">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12.53.02C13.84 0 15.14.01 16.44 0c.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
                  </SocialIcon>
                  <SocialIcon label="Instagram">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
                  </SocialIcon>
                </div>
              </div>

              <p className="max-w-xs text-sm text-grey40">Korean TV all day, everyday. All free.</p>

              <nav className="flex flex-col gap-2 text-sm md:items-end">
                <a href="#service" className="text-grey10/90 transition hover:text-lime">Services</a>
                <a href="#channels" className="text-grey10/90 transition hover:text-lime">Channels</a>
                <a href="#how-to-watch" className="text-grey10/90 transition hover:text-lime">How to watch</a>
              </nav>
            </div>

            <div className="mt-10 border-t border-white/10 pt-6 text-center text-xs text-grey60">
              © 2025 by NEW ID Co., Ltd.
            </div>
          </Section>
        </footer>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      return (
        <div className="overflow-x-hidden">
          <Header />
          <main>
            <Hero />
            <OneClickInstall />
            <HowToWatch />
            <ContentGrid />
            <Service />
            <Faq />
          </main>
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
