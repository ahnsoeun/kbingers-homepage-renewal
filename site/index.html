<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kbingers — Korean TV all day, everyday. All free.</title>
  <meta name="description" content="The Only 24/7 Premium Korean content FAST/AVOD Streaming Platform. K-dramas, K-movies, K-pop, variety and K-food. All free." />

  <!-- ⚠️ 모든 CDN 은 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원). -->
  <!-- Poppins for Latin; Pretendard stays loaded because Poppins has no Korean glyphs -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>

  <script>
    // ========================================
    // Tailwind theme extension — Kbingers design tokens
    // ========================================
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lime: '#D3F47C',
            install: '#2F6BFF',   // accent for the light 1-Click Install band
            live: '#F03838',
            grey10: '#F2F2F2',
            grey40: '#ADADAE',
            grey60: '#707071',
            grey75: '#3C3C3D',
            grey80: '#2D2D2E',
            grey90: '#10160E',
            bg: '#10160E',
          },
          fontFamily: {
            sans: ['Poppins', 'Pretendard', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    html { scroll-behavior: smooth; }
    body { background:#10160E; color:#fff; font-family:'Poppins','Pretendard',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }

    /* Headings baseline */
    .kb-display { font-weight:600; letter-spacing:-0.02em; text-transform:uppercase; line-height:1.02; }

    /* ---- Infinite marquees ---- */
    @keyframes kb-scroll-left  { from { transform: translateX(0); }    to { transform: translateX(-50%); } }
    @keyframes kb-scroll-right { from { transform: translateX(-50%); } to { transform: translateX(0); } }
    .kb-marquee-track { display:flex; width:max-content; will-change:transform; }
    .kb-anim-left  { animation: kb-scroll-left  var(--dur,40s) linear infinite; }
    .kb-anim-right { animation: kb-scroll-right var(--dur,40s) linear infinite; }
    .kb-marquee:hover .kb-anim-left,
    .kb-marquee:hover .kb-anim-right { animation-play-state: paused; }
    @media (prefers-reduced-motion: reduce) {
      .kb-anim-left, .kb-anim-right { animation: none; }
    }

    /* ---- FAQ accordion ---- */
    .kb-acc-body { display:grid; grid-template-rows:0fr; transition:grid-template-rows .35s ease; }
    .kb-acc-body.open { grid-template-rows:1fr; }
    .kb-acc-inner { overflow:hidden; }

    /* Focus ring */
    :focus-visible { outline:2px solid #D3F47C; outline-offset:2px; border-radius:6px; }

    /* Fade-up on scroll */
    .kb-reveal { opacity:0; transform:translateY(24px); transition:opacity .6s ease, transform .6s ease; }
    .kb-reveal.kb-in { opacity:1; transform:none; }

    /* Custom scrollbar hidden for grids */
    .kb-noscroll::-webkit-scrollbar { display:none; }
    .kb-noscroll { -ms-overflow-style:none; scrollbar-width:none; }

    /* Korean copy breaks on word boundaries, not mid-word */
    .kb-ko { word-break: keep-all; }

    /* Platform wordmarks scale as one set: each logo keeps its own tuned size and
       they all shrink by the same factor on narrow screens. */
    .kb-logorow { --logo-scale: 0.72; }
    @media (min-width: 480px) { .kb-logorow { --logo-scale: 0.85; } }
    @media (min-width: 640px) { .kb-logorow { --logo-scale: 1; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // React hooks
    // ========================================
    const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

    // ========================================
    // 🎨 DESIGN SYSTEM COMPONENTS
    // ========================================

    // Small uppercase section-label pill. `onLight` swaps to the dark brand green so
    // the pill reads on the light 1-Click Install band as well as on dark sections.
    function SectionLabel({ children, onLight = false, className = '' }) {
      const tone = onLight ? 'bg-install/10 text-install' : 'bg-install/[0.18] text-[#7FA5FF]';
      return (
        <span className={`inline-block rounded-full px-4 py-1.5 text-[11px] font-semibold uppercase tracking-[0.18em] ${tone} ${className}`}>
          {children}
        </span>
      );
    }

    // Rounded pill button
    function Button({ variant = 'primary', size = 'md', className = '', children, ...rest }) {
      const base = 'inline-flex items-center justify-center gap-2 rounded-full font-semibold transition-all duration-200 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed';
      const sizes = {
        sm: 'px-4 py-2 text-sm',
        md: 'px-6 py-3 text-sm md:text-base',
        lg: 'px-8 py-4 text-base',
      };
      const variants = {
        primary: 'bg-lime text-grey90 shadow-lg shadow-lime/20 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-lime/30 active:translate-y-0 active:scale-[0.98]',
        outline: 'border border-white/25 bg-white/[0.02] text-white backdrop-blur-sm hover:-translate-y-0.5 hover:border-white/60 hover:bg-white/[0.06]',
        ghost: 'text-white/80 hover:text-white',
        dark: 'bg-grey80 text-white border border-white/10 hover:bg-grey75 hover:-translate-y-0.5',
      };
      return (
        <button className={`${base} ${sizes[size]} ${variants[variant]} ${className}`} {...rest}>
          {children}
        </button>
      );
    }

    // Chevron — drawn rather than set as the "›" glyph, which renders as a thin
    // typographic mark and sits off the optical centre at UI sizes.
    function Chevron({ size = 16, className = '' }) {
      return (
        <svg
          width={size} height={size} viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
          className={`shrink-0 ${className}`} aria-hidden="true"
        >
          <path d="M9 5l7 7-7 7" />
        </svg>
      );
    }

    // Star rating. Drawn rather than set with the ★ glyph because a half star has no
    // glyph — each star's fill is a hard gradient stop at its own fill fraction.
    function Stars({ value = 4.5, size = 11, gap = 2.5, className = '' }) {
      const uid = React.useId().replace(/[^a-zA-Z0-9]/g, '');
      return (
        <span className={`flex items-center ${className}`} style={{ gap }} aria-hidden="true">
          {[0, 1, 2, 3, 4].map((i) => {
            const fill = Math.max(0, Math.min(1, value - i));
            const id = `star-${uid}-${i}`;
            return (
              <svg key={i} width={size} height={size} viewBox="0 0 24 24" className="shrink-0">
                <defs>
                  <linearGradient id={id} x1="0" y1="0" x2="1" y2="0">
                    <stop offset={fill} stopColor="currentColor" />
                    <stop offset={fill} stopColor="currentColor" stopOpacity="0.28" />
                  </linearGradient>
                </defs>
                <path
                  d="M12 1.9l3.09 6.26 6.91 1.01-5 4.87 1.18 6.88L12 17.67l-6.18 3.25L7 14.04 2 9.17l6.91-1.01z"
                  fill={`url(#${id})`}
                />
              </svg>
            );
          })}
        </span>
      );
    }

    // Card wrapper
    function Card({ className = '', children, ...rest }) {
      return (
        <div className={`rounded-3xl ${className}`} {...rest}>{children}</div>
      );
    }

    // LIVE badge
    function LiveBadge() {
      return (
        <span className="inline-flex items-center gap-1 rounded-md bg-live px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-wide text-white">
          <span className="h-1.5 w-1.5 rounded-full bg-white animate-pulse" /> Live
        </span>
      );
    }

    // Reveal-on-scroll wrapper
    function Reveal({ as: Tag = 'div', className = '', children, ...rest }) {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { el.classList.add('kb-in'); obs.unobserve(el); } });
        }, { threshold: 0.12 });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      return <Tag ref={ref} className={`kb-reveal ${className}`} {...rest}>{children}</Tag>;
    }

    // Section container — 1200px rail, matching the design's content width
    function Section({ id, className = '', children }) {
      return (
        <section id={id} className={`mx-auto w-full max-w-[1200px] px-5 sm:px-8 ${className}`}>
          {children}
        </section>
      );
    }

    // Infinite marquee for wordmarks/logos
    function LogoMarquee({ items, dur = '35s' }) {
      const doubled = [...items, ...items];
      return (
        <div className="kb-marquee relative overflow-hidden" aria-hidden="true">
          <div className="kb-marquee-track kb-anim-left" style={{ '--dur': dur }}>
            {doubled.map((label, i) => (
              <span key={i} className="mx-8 select-none whitespace-nowrap text-lg font-semibold uppercase tracking-wide text-grey60 sm:text-xl">
                {label}
              </span>
            ))}
          </div>
        </div>
      );
    }

    // ========================================
    // Data
    // ========================================
    // Brand wordmarks exported from Figma, trimmed to their ink bounds. 20px is the
    // shared height; LG and Fire TV get 26px because their marks are not lettering
    // alone — LG carries a circular badge, Fire TV a smile arc beneath the words — so
    // at a common box height their letters render noticeably smaller than the rest.
    const LOGO_HEIGHT = 20;
    const PLATFORMS = [
      { name: 'Samsung TV', src: 'assets/logo-samsung.png' },
      { name: 'LG TV',      src: 'assets/logo-lg.png',     h: 26 },
      { name: 'Roku',       src: 'assets/logo-roku.png',   w: 48 },
      { name: 'Fire TV',    src: 'assets/logo-firetv.png', h: 26 },
      { name: 'VIZIO',      src: 'assets/logo-vizio.png',   w: 80 },
      { name: 'Google TV',  src: 'assets/logo-googletv.png' },
    ];

    // Same six platforms as install links. Heights are smaller than the wordmark row
    // and follow the same rule: pure lettering sits lower, marks-with-glyphs sit higher.
    const PLATFORM_LINKS = [
      { name: 'Samsung TV', src: 'assets/logo-samsung.png',  h: 10 },
      { name: 'LG TV',      src: 'assets/logo-lg.png',       h: 18 },
      { name: 'VIZIO',      src: 'assets/logo-vizio.png',    h: 12 },
      { name: 'Google TV',  src: 'assets/logo-googletv.png', h: 14 },
    ];

    // Gradient palette for content thumbnails
    const GRAD = {
      purple: 'linear-gradient(135deg,#3b1a63,#7b2ff7,#d3f47c22)',
      sky:    'linear-gradient(135deg,#1b3a5c,#2f80c9,#7fd0ff33)',
      rose:   'linear-gradient(135deg,#5c1b3a,#c9407e,#ffd0e033)',
      slate:  'linear-gradient(135deg,#1c2b26,#3c4c44,#d3f47c22)',
      amber:  'linear-gradient(135deg,#5c3a1b,#c98b2f,#ffe6b033)',
      teal:   'linear-gradient(135deg,#123a36,#1f8a7a,#7ffce033)',
      indigo: 'linear-gradient(135deg,#1a2363,#4a52d6,#c9d0ff33)',
      green:  'linear-gradient(135deg,#12401f,#2f9d4a,#c9ffd033)',
    };

    const ROW1 = [
      { title: 'NEW KPOP', sub: 'First and Only 24/7 K-Pop', grad: GRAD.purple, live: true },
      { title: 'WAIKIKI 2', sub: 'Variety · Comedy', grad: GRAD.amber },
      { title: 'Boys Over Flowers', sub: 'Classic K-Drama', grad: GRAD.rose },
      { title: 'The Good Detective', sub: 'Crime · Thriller', grad: GRAD.slate },
    ];
    const ROW2 = [
      { title: 'JTBC News', sub: 'Live News Channel', grad: GRAD.indigo, live: true },
      { title: 'Missing Crown Prince', sub: 'Historical Romance', grad: GRAD.teal },
      { title: 'NEW KMOVIES', sub: '24/7 Korean Films', grad: GRAD.purple },
      { title: 'When the Weather Is Fine', sub: 'Healing Drama', grad: GRAD.sky },
    ];
    const ROW3 = [
      { title: 'NEW KFOOD', sub: '24/7 Korean Food', grad: GRAD.green },
      { title: 'WEEKLY IDOL', sub: 'K-Pop Variety', grad: GRAD.rose },
      { title: 'K-ASMR', sub: 'Relax & Unwind', grad: GRAD.teal },
      { title: 'THE PACKAGE', sub: 'Romance · Travel', grad: GRAD.amber },
    ];

    const FAQS = [
      { q: 'What is Kbingers?', a: 'Kbingers is a 24/7 premium Korean-content FAST/AVOD streaming platform. Enjoy K-dramas, K-movies, K-pop, variety shows and K-food across live curated channels and an on-demand library — Korean TV all day, everyday, all free.' },
      { q: 'Is Kbingers really free?', a: 'Yes. Kbingers is 100% free. There is no subscription, no signup and no credit card required. The service is ad-supported (FAST/AVOD), so you can start watching instantly at no cost.' },
      { q: 'Where is Kbingers available?', a: 'Kbingers is available across major connected-TV platforms and streaming devices in supported regions, including Samsung TV, LG TV, Roku, Amazon Fire TV, VIZIO and Google TV.' },
      { q: 'Where can I watch Kbingers?', a: 'You can watch on your Smart TV or streaming device through the Kbingers app, or from any browser at bingekorea.tv. Pick a live channel to lean back, or browse on demand to choose exactly what you want.' },
      { q: 'How do I download Kbingers?', a: 'Search "Kbingers" in your TV platform’s app store (Samsung, LG, Roku, Fire TV, VIZIO or Google TV) and install it — or use 1-Click Install to send the app straight to your TV from your phone in minutes.' },
      { q: 'How do I save my favorite content?', a: 'Browse the on-demand library and add titles to your favorites to build a personal watchlist. Your picks are kept handy so you can jump back into a show or movie anytime.' },
      { q: 'Contact Us', a: 'Need help or have a partnership inquiry? Reach out to NEW ID Co., Ltd. through the contact channels on bingekorea.tv or our social accounts — we are always here to help.' },
    ];

    // ========================================
    // 🧩 LAYOUT — Header
    // ========================================
    const NAV_LINKS = [
      { label: 'NEW ID', href: '#newid' },
      { label: 'How to watch', href: '#how-to-watch' },
      { label: 'Channels', href: '#channels' },
      { label: 'Services', href: '#service' },
      { label: 'FAQ', href: '#faq' },
    ];

    function Wordmark({ className = '' }) {
      return (
        <a href="#top" className={`font-extrabold italic tracking-tight ${className}`} aria-label="Kbingers home">
          <span className="text-lime">K</span><span className="text-white">bingers</span>
        </a>
      );
    }

    function Header() {
      const [scrolled, setScrolled] = useState(false);
      const [open, setOpen] = useState(false);
      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 20);
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return (
        <header className={`fixed inset-x-0 top-0 z-50 transition-colors duration-300 ${scrolled ? 'bg-grey90/85 backdrop-blur-md' : 'bg-transparent'}`}>
          {/* Hairline sits inside the max-width rail, matching the design */}
          <nav className="mx-auto flex max-w-[1200px] items-center justify-between border-b border-white/15 px-5 py-4 sm:px-8">
            <a href="#top" aria-label="Kbingers home" className="inline-flex items-center">
              <img src="assets/logo-kbingers.png" alt="Kbingers" className="h-auto w-[90px]" />
            </a>
            <div className="hidden items-center gap-8 md:flex">
              {NAV_LINKS.map((l) => (
                <a key={l.label} href={l.href} className="text-sm font-medium text-grey10/90 transition-colors hover:text-lime">
                  {l.label}
                </a>
              ))}
            </div>
            <button
              className="md:hidden text-white"
              aria-label="Toggle menu"
              aria-expanded={open}
              onClick={() => setOpen((v) => !v)}
            >
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                {open ? <><path d="M6 6l12 12" /><path d="M18 6L6 18" /></> : <><path d="M4 7h16" /><path d="M4 12h16" /><path d="M4 17h16" /></>}
              </svg>
            </button>
          </nav>
          {open && (
            <div className="md:hidden border-t border-white/10 bg-grey90/95 backdrop-blur-md">
              <div className="flex flex-col px-5 py-3">
                {NAV_LINKS.map((l) => (
                  <a key={l.label} href={l.href} onClick={() => setOpen(false)}
                     className="py-3 text-sm font-medium text-grey10/90 hover:text-lime">
                    {l.label}
                  </a>
                ))}
              </div>
            </div>
          )}
        </header>
      );
    }

    // ========================================
    // 📄 Hero
    // ========================================
    // ⭐ App-store rating — laurel wreath flanking the score, per the design
    function RatingBadge() {
      return (
        <div className="flex flex-col items-center">
          <div className="flex items-center justify-center gap-1.5">
            <img src="assets/laurel-left.png" alt="" aria-hidden="true" className="h-[52px] w-auto opacity-80 sm:h-[62px]" />
            <div className="flex flex-col items-center px-1">
              <span className="text-[28px] font-semibold leading-[0.9] text-white sm:text-[33px]">4.5</span>
              <Stars value={4.5} size={11} className="mt-[7px] text-white" />
            </div>
            <img src="assets/laurel-right.png" alt="" aria-hidden="true" className="h-[52px] w-auto opacity-80 sm:h-[62px]" />
          </div>
          {/* Sits under the whole wreath rather than inside it — the laurels leave too
              little width between them for a line this long. */}
          <span className="mt-[10px] text-[10px] font-light leading-none tracking-[0.04em] text-white/55 sm:text-[11px]">
            Based on Viewer Feedback
          </span>
          <span className="sr-only">Rated 4.5 out of 5, based on viewer feedback</span>
        </div>
      );
    }

    // Wall of K-content behind the hero, as in the design: real poster artwork,
    // sharp at the edges and softened through the middle, under a heavy scrim.
    function HeroBackdrop() {
      return (
        <div className="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
          {/* Height fills, width keeps the poster proportions — squeezing 2560px of wall
              into a 1440px viewport turns the posters into unreadable slivers. Anchored
              left so the sharp, unmirrored blocks are the ones on screen. */}
          <div
            className="absolute inset-0 bg-cover bg-center sm:bg-[length:auto_100%] sm:bg-left sm:bg-repeat-x"
            style={{ backgroundImage: "url('assets/hero-wall.jpg')" }}
          />
          {/* The design has a 680px margin either side of its 1200px rail, so the wall
              reads there. At normal widths there is no such margin — so instead of a
              full-field scrim, pool the darkness behind the headline and let the
              posters carry everywhere else. */}
          <div
            className="absolute inset-0"
            style={{
              backgroundColor: 'rgba(16,22,14,0.40)',
              background: [
                'radial-gradient(46% 32% at 50% 26%, rgba(16,22,14,0.86), rgba(16,22,14,0) 72%)',
                'linear-gradient(to top, #10160E 0%, rgba(16,22,14,0) 34%)',
                'linear-gradient(rgba(16,22,14,0.40), rgba(16,22,14,0.40))',
              ].join(', '),
            }}
          />
          <div className="absolute inset-x-0 bottom-0 h-40" style={{ background: 'linear-gradient(to top,#10160E,transparent)' }} />
        </div>
      );
    }

    // TEMPORARY card artwork. Real photography is coming — when it lands, replace this
    // whole component with a single <img className="absolute inset-0 h-full w-full
    // object-cover" /> and nothing else in InstallCard needs to change.
    function CardPlaceholder({ tint }) {
      return (
        <div className="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
          <div className="absolute inset-0" style={{ background: tint }} />
          <div
            className="absolute inset-0 opacity-[0.05]"
            style={{ backgroundImage: 'repeating-linear-gradient(135deg,#fff 0 1px,transparent 1px 11px)' }}
          />
        </div>
      );
    }

    // Platform install card — copy up top, brand CTA, artwork filling the card
    function InstallCard({ platform, cta, logo, logoHeight, brandBg, brandFg, tint, href = '#install' }) {
      return (
        <a
          href={href}
          className="group relative flex h-[268px] flex-col items-center overflow-hidden rounded-[20px] border border-white/15 bg-grey90 px-5 pt-7 transition-colors duration-200 hover:border-white/35 sm:h-[344px] sm:pt-9"
        >
          <div className="absolute inset-0 transition-transform duration-500 group-hover:scale-[1.03]">
            <CardPlaceholder tint={tint} />
          </div>
          {/* Scrim runs from the very top so the copy sits on solid dark and the
              artwork emerges lower down */}
          <span
            className="pointer-events-none absolute inset-0"
            style={{ background: 'linear-gradient(to bottom, #10160E 0%, rgba(16,22,14,0.94) 26%, rgba(16,22,14,0.62) 48%, rgba(16,22,14,0.22) 68%, rgba(16,22,14,0.05) 100%)' }}
            aria-hidden="true"
          />

          <span className="relative text-[16px] font-light text-white/85">
            Have a <span className="font-semibold text-white">{platform}</span>?
          </span>
          <span className="relative mt-1.5 text-[26px] font-semibold leading-tight tracking-tight text-white sm:text-[34px]">
            Install in One Click
          </span>
          <span
            className="relative mt-5 flex w-full max-w-[292px] items-center gap-3 rounded-[10px] px-5 py-3.5 shadow-lg transition-transform duration-200 group-hover:scale-[1.02] sm:mt-6"
            style={{ background: brandBg, color: brandFg }}
          >
            <img src={logo} alt="" className="w-auto shrink-0" style={{ height: logoHeight }} />
            <span className="flex-1 text-left text-[13px] font-normal sm:text-sm">{cta}</span>
            <Chevron size={17} className="opacity-80 transition-transform duration-200 group-hover:translate-x-1" />
          </span>
        </a>
      );
    }

    function Hero() {
      return (
        <div id="top" className="relative isolate">
          <HeroBackdrop />
          <Section className="relative pb-14 pt-28 sm:pb-20 sm:pt-32">
            <Reveal className="flex flex-col items-center text-center">
              <RatingBadge />
              <h1 className="mt-6 text-[32px] font-semibold leading-[1.1] tracking-[-0.02em] text-white [text-wrap:balance] sm:whitespace-nowrap sm:text-[54px]">
                Watch Korean TV for Free
              </h1>

              {/* Subhead — Pretendard Light 19px in the comp (node 13232:4110) */}
              <p className="mt-4 max-w-lg text-[18px] font-light leading-snug text-white/75 [text-wrap:balance] sm:max-w-none">
                Enjoy K-Dramas, Movies, TV Shows, K-POP &amp; More on Your TV
              </p>

              {/* Where you can watch */}
              <ul className="kb-logorow mt-7 flex flex-wrap items-center justify-center gap-x-6 gap-y-4 sm:gap-x-[50px] sm:gap-y-5">
                {PLATFORMS.map((p) => (
                  <li key={p.name}>
                    <img
                      src={p.src}
                      alt={p.name}
                      className="w-auto opacity-90 transition-opacity duration-200 hover:opacity-100"
                      style={p.w
                        ? { width: `calc(${p.w}px * var(--logo-scale, 1))` }
                        : { height: `calc(${p.h || LOGO_HEIGHT}px * var(--logo-scale, 1))` }}
                    />
                  </li>
                ))}
              </ul>
            </Reveal>

            {/* The two platforms with working one-click install links */}
            <Reveal className="mt-9 grid gap-4 sm:mt-11 sm:grid-cols-2 sm:gap-5">
              <InstallCard
                platform="Roku"
                cta="Install on Roku"
                logo="assets/logo-roku.png"
                logoHeight={22}
                brandBg="#313DAD"
                brandFg="#ffffff"
                tint="radial-gradient(130% 105% at 35% 112%, rgba(49,61,173,0.62), rgba(16,22,14,0) 74%)"
              />
              <InstallCard
                platform="Fire TV"
                cta="Install on Fire TV"
                logo="assets/logo-firetv.png"
                logoHeight={22}
                brandBg="#E5621B"
                brandFg="#ffffff"
                tint="radial-gradient(130% 105% at 35% 112%, rgba(229,98,27,0.52), rgba(16,22,14,0) 74%)"
              />
            </Reveal>

            {/* Quick platform links, directly under the cards */}
            <Reveal className="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">
              {PLATFORM_LINKS.map((p) => (
                <InstallButton key={p.name} onDark name={`Install on ${p.name}`} href="#install" />
              ))}
            </Reveal>
          </Section>
        </div>
      );
    }

    // ========================================
    // 📄 NEW SECTION — 1-Click Install
    // ========================================
    // Realistic phone bezel — notch + home indicator, matches TV frame language
    function PhoneMock() {
      return (
        <div className="relative h-[104px] w-[56px] shrink-0 rounded-[10px] border-[3px] border-grey90 bg-grey90 px-1 pb-2.5 pt-3 shadow-lg">
          <span className="absolute left-1/2 top-[5px] z-10 h-[3px] w-4 -translate-x-1/2 rounded-full bg-black/50" aria-hidden="true" />
          <div className="flex h-full flex-col items-center justify-center gap-2 rounded-[6px] bg-gradient-to-b from-grey80 to-grey90">
            <div className="flex h-6 w-6 items-center justify-center rounded-[5px] bg-lime/20 text-[11px] font-black text-lime">K</div>
            <span className="rounded-full bg-lime px-1.5 py-[2px] text-[6px] font-bold leading-none text-grey90">Install</span>
          </div>
          <span className="absolute bottom-[4px] left-1/2 h-0.5 w-5 -translate-x-1/2 rounded-full bg-white/20" aria-hidden="true" />
        </div>
      );
    }
    // TV bezel + stand — same frame language as the phone mock
    function TvMock({ children }) {
      return (
        <div className="w-[116px] shrink-0">
          <div className="aspect-video w-full rounded border-[3px] border-grey90 bg-grey90 p-1.5 shadow-lg">
            {children}
          </div>
          <div className="mx-auto mt-0.5 h-2 w-4 bg-grey90/70" style={{ clipPath: 'polygon(30% 0,70% 0,100% 100%,0 100%)' }} />
          <div className="mx-auto h-1 w-14 rounded-full bg-grey90/40" />
        </div>
      );
    }

    // Device on top, badge+title row below it, caption below that — every
    // step stacks the same three blocks in the same order, so the badge row
    // always starts at deviceSlotHeight + gap from the top of its column,
    // identical for all three steps regardless of device shape or caption
    // length. The device slot is a fixed height so the phone (tall) and the
    // TVs (short + stand) share one visual centreline instead of each
    // dragging its row to a different height. The caption gets a fixed
    // min-height sized for its longest (3-line) case so all three blocks
    // read as the same size even though the Korean copy wraps unevenly.
    function InstallStep({ n, title, caption, children }) {
      return (
        <li className="flex w-full flex-col items-center text-center lg:w-[248px]">
          {/* items-end puts the phone and the two TV stands on one baseline — centring
              them instead leaves the shorter sets floating in the slot */}
          <div className="flex h-28 w-full items-end justify-center pb-1">
            {children}
          </div>
          <div className="mt-5 flex items-center gap-2">
            <span className="flex h-[22px] w-[22px] shrink-0 items-center justify-center rounded-full bg-install text-[11px] font-black text-white">
              {n}
            </span>
            <h3 className="whitespace-nowrap text-[16px] font-semibold tracking-tight text-grey90">{title}</h3>
          </div>
          <p className="mt-2 min-h-[3.4em] max-w-[230px] text-[14px] leading-relaxed text-grey60">{caption}</p>
        </li>
      );
    }

    // Arrow sits inside the same fixed-height slot as the device mocks in
    // InstallStep, so its vertical centre always lines up with theirs —
    // regardless of the connector's own li height in the row.
    function Connector() {
      return (
        <li className="hidden shrink-0 lg:block" aria-hidden="true">
          {/* same slot height as a step, arrow parked level with the screens */}
          <div className="flex h-28 items-end justify-center pb-[34px]">
            <span className="text-lg text-grey40">→</span>
          </div>
        </li>
      );
    }

    // Platform install link — logo, label, chevron. `onDark` flips it for the hero,
    // where the wordmarks are already white and must not be inverted.
    function InstallButton({ name, logo, logoHeight, href, primary = false, onDark = false }) {
      const tone = onDark
        ? 'border-white/15 bg-white/[0.04] hover:-translate-y-0.5 hover:border-white/35 hover:bg-white/[0.08]'
        : primary
          ? 'border-grey90/15 bg-white shadow-sm hover:-translate-y-0.5 hover:border-lime/50 hover:shadow-md'
          : 'border-grey90/10 bg-white/60 hover:-translate-y-0.5 hover:border-grey90/25 hover:bg-white';
      return (
        <a href={href} className={`group flex items-center gap-2 rounded-xl border px-5 py-3.5 transition-all duration-200 ${tone}`}>
          {logo && (
            <img src={logo} alt="" className={`w-auto shrink-0 ${onDark ? '' : 'invert'}`} style={{ height: logoHeight }} />
          )}
          <span className={`flex-1 whitespace-nowrap text-left text-[14px] font-normal ${onDark ? 'text-white' : 'text-grey75'}`}>{name}</span>
          <Chevron size={16} className={`transition-transform duration-200 group-hover:translate-x-1 ${onDark ? 'text-white/50' : 'text-grey40'}`} />
        </a>
      );
    }

    function OneClickInstall() {
      return (
        <section id="install" className="bg-[#F1F0F2] py-20 text-grey90 sm:py-28">
          <div className="mx-auto w-full max-w-[1200px] px-5 text-center sm:px-8">
            <div className="flex flex-col">
              {/* Centred header, same rhythm as the dark sections */}
              <Reveal>
                <SectionLabel onLight>1-Click Install</SectionLabel>
                <h2 className="kb-display mt-5 text-3xl text-grey90 sm:text-[40px]">
                  Install on your TV in 3 simple steps
                </h2>
                <p className="mx-auto mt-4 max-w-md text-sm leading-relaxed text-grey60">
                  Get Kbingers on your TV from your phone in minutes.
                </p>
              </Reveal>

              {/* Step flow */}
              <Reveal as="ol" className="mx-auto mt-12 flex max-w-[980px] flex-col items-center gap-10 sm:grid sm:grid-cols-2 sm:gap-x-8 sm:gap-y-12 lg:flex lg:flex-row lg:items-start lg:justify-center lg:gap-2">
                <InstallStep n="1" title="Tap Install" caption="Click the install button on your phone.">
                  <PhoneMock />
                </InstallStep>
                <Connector />
                <InstallStep n="2" title="Confirm Account" caption="Verify the TV account connected to your device.">
                  <TvMock>
                    <div className="flex h-full flex-col items-center justify-center gap-1 text-center">
                      <span className="text-[6px] font-medium text-grey40">Confirm your account</span>
                      <span className="w-full truncate rounded-sm bg-white/10 px-1 py-[3px] text-[6px] text-white">amy.kim@email.com</span>
                      <span className="rounded-full bg-install px-2 py-[2px] text-[6px] font-bold text-white">Confirm</span>
                    </div>
                  </TvMock>
                </InstallStep>
                <Connector />
                <InstallStep n="3" title="Start Watching" caption="The app is automatically installed on your TV.">
                  <TvMock>
                    <div className="flex h-full flex-col items-center justify-center gap-1 text-center">
                      <span className="flex h-5 w-5 items-center justify-center rounded-full bg-lime text-[10px] font-black text-grey90">✓</span>
                      <span className="text-[6px] font-bold text-white">Installation complete</span>
                    </div>
                  </TvMock>
                </InstallStep>
              </Reveal>
            </div>

          </div>
        </section>
      );
    }

    // ========================================
    // 📄 How to Watch — SEE YOU ON TV
    // ========================================
    function HowToWatch() {
      const [playing, setPlaying] = useState(false);
      return (
        <Section id="how-to-watch" className="py-20 text-center sm:py-28">
          <Reveal>
            <SectionLabel>How to watch</SectionLabel>
            <h2 className="kb-display mt-5 text-3xl text-white sm:text-5xl">See you on TV</h2>
          </Reveal>

          {/* Video player placeholder */}
          <Reveal className="mt-10">
            <div className="relative mx-auto aspect-video w-full max-w-3xl overflow-hidden rounded-2xl border border-white/10"
                 style={{ background: 'linear-gradient(135deg,#241243,#5b1f9e 55%,#2a3f6b)' }}
                 role="img" aria-label="Kbingers video player showing a K-pop performance">
              <div className="pointer-events-none absolute inset-0" style={{ background: 'radial-gradient(70% 60% at 50% 40%, rgba(211,244,124,0.12), transparent)' }} />
              <button
                onClick={() => setPlaying((v) => !v)}
                className="absolute left-1/2 top-1/2 flex h-16 w-16 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-white/20 text-2xl text-white backdrop-blur transition hover:scale-110 hover:bg-white/30"
                aria-label={playing ? 'Pause video' : 'Play video'}
              >
                {playing ? '❚❚' : '▶'}
              </button>
              {/* progress bar */}
              <div className="absolute inset-x-4 bottom-4">
                <div className="flex items-center gap-3">
                  <span className="text-[11px] font-medium text-white/80">01:24</span>
                  <div className="h-1 flex-1 overflow-hidden rounded-full bg-white/25">
                    <div className="h-full rounded-full bg-lime transition-all" style={{ width: playing ? '48%' : '32%' }} />
                  </div>
                  <span className="text-[11px] font-medium text-white/60">03:57</span>
                </div>
              </div>
            </div>
          </Reveal>

        </Section>
      );
    }

    // ========================================
    // 📄 Content grid — auto-scrolling rows
    // ========================================
    function ContentCard({ item }) {
      return (
        <div className="group relative mx-2 h-32 w-56 shrink-0 overflow-hidden rounded-xl sm:h-40 sm:w-72"
             style={{ background: item.grad }}>
          <div className="absolute inset-0 bg-black/10 transition group-hover:bg-black/0" />
          {item.live && <div className="absolute right-2 top-2"><LiveBadge /></div>}
          <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/70 to-transparent p-3">
            <p className="text-sm font-semibold uppercase leading-tight text-white drop-shadow sm:text-base">{item.title}</p>
            <p className="mt-0.5 text-[10px] font-medium text-white/70 sm:text-xs">{item.sub}</p>
          </div>
        </div>
      );
    }

    function ContentRow({ items, direction = 'left', dur = '45s' }) {
      const doubled = [...items, ...items, ...items, ...items];
      const anim = direction === 'left' ? 'kb-anim-left' : 'kb-anim-right';
      return (
        <div className="kb-marquee relative overflow-hidden py-2">
          <div className={`kb-marquee-track ${anim}`} style={{ '--dur': dur }}>
            {doubled.map((it, i) => <ContentCard key={i} item={it} />)}
          </div>
        </div>
      );
    }

    function ContentGrid() {
      return (
        <section id="channels" className="py-10">
          <div className="flex flex-col gap-2">
            <ContentRow items={ROW1} direction="left" dur="48s" />
            <ContentRow items={ROW2} direction="right" dur="55s" />
            <ContentRow items={ROW3} direction="left" dur="50s" />
          </div>
        </section>
      );
    }

    // ========================================
    // 📄 Service
    // ========================================
    // Small fake channel-UI screenshot placeholder
    function ChannelUIMock() {
      return (
        <div className="aspect-video w-full overflow-hidden rounded-xl border border-white/10 bg-grey90 p-2">
          <div className="flex h-full gap-2">
            <div className="hidden w-10 shrink-0 flex-col gap-1.5 sm:flex">
              {[0,1,2,3,4].map(i => <div key={i} className={`h-6 rounded ${i===1?'bg-lime/70':'bg-grey75'}`} />)}
            </div>
            <div className="flex flex-1 flex-col gap-1.5">
              <div className="h-1/2 rounded" style={{ background: GRAD.purple }} />
              <div className="grid flex-1 grid-cols-4 gap-1.5">
                {[GRAD.rose,GRAD.sky,GRAD.amber,GRAD.teal].map((g,i)=>(
                  <div key={i} className="rounded" style={{ background: g }} />
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }
    // On-demand thumbnail placeholder
    function OnDemandMock() {
      return (
        <div className="aspect-video w-full overflow-hidden rounded-xl border border-black/10 bg-grey90 p-2">
          <div className="relative mb-1.5 h-1/2 w-full rounded" style={{ background: GRAD.slate }}>
            <span className="absolute bottom-1.5 left-2 text-xs font-extrabold uppercase text-white/90">The Royal Tailor</span>
          </div>
          <div className="grid grid-cols-4 gap-1.5" style={{ height: '42%' }}>
            {[GRAD.rose,GRAD.indigo,GRAD.amber,GRAD.teal].map((g,i)=>(
              <div key={i} className="rounded" style={{ background: g }} />
            ))}
          </div>
        </div>
      );
    }

    function Service() {
      return (
        <Section id="service" className="py-20 text-center sm:py-28">
          <Reveal>
            <SectionLabel>Service</SectionLabel>
            <h2 className="kb-display mx-auto mt-5 max-w-3xl text-3xl text-white sm:text-5xl">
              All genres of Korean content now streaming all day!
            </h2>
          </Reveal>

          <div className="mt-14 flex flex-col gap-6">
            {/* Channel — dark card */}
            <Reveal>
              <Card className="border border-white/10 bg-grey80 p-6 sm:p-10">
                <div className="grid items-center gap-8 md:grid-cols-2">
                  <ChannelUIMock />
                  <div className="text-left">
                    <h3 className="text-2xl font-semibold text-white">Channel</h3>
                    <p className="mt-4 text-sm leading-relaxed text-grey40">
                      Kbingers provides a curated environment for viewers to indulge in a variety of K-content genres with 24/7 live streaming, tailored to their preferences. It offers an optimized user experience (UX/UI) for easy content discovery across genres, comprehensive and individual IP channels. In addition to genre-based channels, viewers can binge-watch their desired content on a per-IP basis, maximizing their viewing pleasure.
                    </p>
                  </div>
                </div>
              </Card>
            </Reveal>

            {/* On Demand — light card */}
            <Reveal>
              <Card className="bg-grey10 p-6 text-grey90 sm:p-10">
                <div className="grid items-center gap-8 md:grid-cols-2">
                  <div className="text-left">
                    <h3 className="text-2xl font-semibold text-grey90">On Demand</h3>
                    <p className="mt-4 text-sm leading-relaxed text-grey60">
                      Kbingers provides a convenient service that allows users to select and watch their favorite K-content for free at any time. It offers the flexibility to enjoy a wide variety of Korean genres and topics. The intuitive user interface and search functions make it easy to find specific programs or movies, creating a more seamless viewing experience for users.
                    </p>
                  </div>
                  <OnDemandMock />
                </div>
              </Card>
            </Reveal>
          </div>
        </Section>
      );
    }

    // ========================================
    // 📄 FAQ — accordion
    // ========================================
    function FaqItem({ item, isOpen, onToggle, index }) {
      const btnId = `faq-btn-${index}`;
      const panelId = `faq-panel-${index}`;
      return (
        <div className="overflow-hidden rounded-xl border border-white/10 bg-grey80/60">
          <button
            id={btnId}
            aria-expanded={isOpen}
            aria-controls={panelId}
            onClick={onToggle}
            className="flex w-full items-center justify-between gap-4 px-5 py-4 text-left transition hover:bg-white/[0.03]"
          >
            <span className="text-sm font-semibold text-white sm:text-base">{item.q}</span>
            <span className={`text-xl leading-none text-lime transition-transform duration-300 ${isOpen ? 'rotate-45' : ''}`} aria-hidden="true">+</span>
          </button>
          <div id={panelId} role="region" aria-labelledby={btnId} className={`kb-acc-body ${isOpen ? 'open' : ''}`}>
            <div className="kb-acc-inner">
              <p className="px-5 pb-5 text-sm leading-relaxed text-grey40">{item.a}</p>
            </div>
          </div>
        </div>
      );
    }

    function Faq() {
      const [openSet, setOpenSet] = useState(() => new Set([0]));
      const toggle = (i) => setOpenSet((prev) => {
        const next = new Set(prev);
        next.has(i) ? next.delete(i) : next.add(i);
        return next;
      });
      return (
        <Section id="faq" className="py-20 sm:py-28">
          <Reveal className="text-center">
            <SectionLabel>FAQ</SectionLabel>
            <h2 className="kb-display mx-auto mt-5 max-w-xl text-3xl text-white sm:text-5xl">
              Questions? We're always here to help
            </h2>
          </Reveal>
          <Reveal className="mx-auto mt-12 flex max-w-3xl flex-col gap-3">
            {FAQS.map((item, i) => (
              <FaqItem key={i} index={i} item={item} isOpen={openSet.has(i)} onToggle={() => toggle(i)} />
            ))}
          </Reveal>
        </Section>
      );
    }

    // ========================================
    // 🧩 Footer
    // ========================================
    function SocialIcon({ label, children, href = '#' }) {
      return (
        <a href={href} aria-label={label} className="flex h-9 w-9 items-center justify-center rounded-full border border-white/15 text-white/80 transition hover:border-lime hover:text-lime">
          {children}
        </a>
      );
    }

    function Footer() {
      return (
        <footer id="newid" className="border-t border-white/10 py-12">
          <Section>
            {/* Three columns, as on bingekorea.tv: socials left, wordmark + tagline
                centred, nav right — with a hairline under the row. */}
            <div className="flex flex-col items-center gap-8 border-b border-white/15 pb-8 text-center md:flex-row md:items-center md:justify-between md:gap-4">
              <div className="flex gap-2.5 md:flex-1">
                <SocialIcon label="X (Twitter)">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.66l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </SocialIcon>
                <SocialIcon label="TikTok">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12.53.02C13.84 0 15.14.01 16.44 0c.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
                </SocialIcon>
                <SocialIcon label="Instagram">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
                </SocialIcon>
              </div>

              <div className="flex flex-col items-center gap-5">
                <a href="#top" aria-label="Kbingers home">
                  <img src="assets/logo-kbingers.png" alt="Kbingers" className="h-auto w-[111px]" />
                </a>
                <p className="text-sm leading-[21px] text-[#ccc]">
                  Korean TV All day,<br />everyday. All Free.
                </p>
              </div>

              <nav className="flex flex-wrap items-center justify-center gap-x-[30px] gap-y-2 md:flex-1 md:justify-end">
                <a href="#service" className="text-[14px] font-medium text-white transition hover:text-lime">Services</a>
                <a href="#channels" className="text-[14px] font-medium text-white transition hover:text-lime">Channels</a>
                <a href="#how-to-watch" className="text-[14px] font-medium text-white transition hover:text-lime">How to watch</a>
              </nav>
            </div>

            <p className="mt-5 text-center text-xs tracking-[-0.02em] text-[#8a8a8a]">
              © 2026 by NEW ID Co.,Ltd.
            </p>
          </Section>
        </footer>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      return (
        <div className="overflow-x-hidden">
          <Header />
          <main>
            <Hero />
            <OneClickInstall />
            <HowToWatch />
            <ContentGrid />
            <Service />
            <Faq />
          </main>
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
