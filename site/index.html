<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kbingers — Korean TV all day, everyday. All free.</title>
  <meta name="description" content="The Only 24/7 Premium Korean content FAST/AVOD Streaming Platform. K-dramas, K-movies, K-pop, variety and K-food. All free." />

  <!-- ⚠️ 모든 CDN 은 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원). -->
  <!-- Poppins for Latin; Pretendard stays loaded because Poppins has no Korean glyphs -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>

  <script>
    // ========================================
    // Tailwind theme extension — Kbingers design tokens
    // ========================================
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lime: '#D3F47C',
            install: '#2F6BFF',   // accent for the light 1-Click Install band
            live: '#F03838',
            grey10: '#F2F2F2',
            grey40: '#ADADAE',
            grey60: '#707071',
            grey75: '#3C3C3D',
            grey80: '#2D2D2E',
            grey90: '#10160E',
            bg: '#10160E',
          },
          fontFamily: {
            sans: ['Poppins', 'Pretendard', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    html { scroll-behavior: smooth; }
    body { background:#10160E; color:#fff; font-family:'Poppins','Pretendard',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }

    /* Headings baseline */
    .kb-display { font-weight:600; letter-spacing:-0.02em; text-transform:uppercase; line-height:1.02; }

    /* ---- Infinite marquees ---- */
    @keyframes kb-scroll-left  { from { transform: translateX(0); }    to { transform: translateX(-50%); } }
    @keyframes kb-scroll-right { from { transform: translateX(-50%); } to { transform: translateX(0); } }
    .kb-marquee-track { display:flex; width:max-content; will-change:transform; }
    .kb-anim-left  { animation: kb-scroll-left  var(--dur,40s) linear infinite; }
    .kb-anim-right { animation: kb-scroll-right var(--dur,40s) linear infinite; }
    .kb-marquee:hover .kb-anim-left,
    .kb-marquee:hover .kb-anim-right { animation-play-state: paused; }
    @media (prefers-reduced-motion: reduce) {
      .kb-anim-left, .kb-anim-right { animation: none; }
    }

    /* ---- FAQ accordion ---- */
    .kb-acc-body { display:grid; grid-template-rows:0fr; transition:grid-template-rows .35s ease; }
    .kb-acc-body.open { grid-template-rows:1fr; }
    .kb-acc-inner { overflow:hidden; }

    /* Focus ring */
    :focus-visible { outline:2px solid #D3F47C; outline-offset:2px; border-radius:6px; }

    /* Fade-up on scroll */
    .kb-reveal { opacity:0; transform:translateY(24px); transition:opacity .6s ease, transform .6s ease; }
    .kb-reveal.kb-in { opacity:1; transform:none; }

    /* Custom scrollbar hidden for grids */
    .kb-noscroll::-webkit-scrollbar { display:none; }
    .kb-noscroll { -ms-overflow-style:none; scrollbar-width:none; }

    /* Korean copy breaks on word boundaries, not mid-word */
    .kb-ko { word-break: keep-all; }

    /* Platform wordmarks scale as one set: each logo keeps its own tuned size and
       they all shrink by the same factor on narrow screens. */
    .kb-logorow { --logo-scale: 0.72; }
    @media (min-width: 480px) { .kb-logorow { --logo-scale: 0.85; } }
    @media (min-width: 640px) { .kb-logorow { --logo-scale: 1; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // React hooks
    // ========================================
    const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

    // ========================================
    // 🎨 DESIGN SYSTEM COMPONENTS
    // ========================================

    // Small uppercase section-label pill. `onLight` swaps to the dark brand green so
    // the pill reads on the light 1-Click Install band as well as on dark sections.
    function SectionLabel({ children, onLight = false, bolt = false, className = '' }) {
      const tone = onLight ? 'bg-lime text-grey90' : 'bg-lime/15 text-lime';
      return (
        <span className={`inline-flex items-center gap-1.5 rounded-full px-4 py-1.5 text-[12px] font-semibold uppercase tracking-[0.18em] ${tone} ${className}`}>
          {bolt && (
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" className="shrink-0">
              <path d="M13 2L4.5 13.5H11l-1 8.5 8.5-11.5H12z" />
            </svg>
          )}
          {children}
        </span>
      );
    }

    // Rounded pill button
    function Button({ variant = 'primary', size = 'md', className = '', children, ...rest }) {
      const base = 'inline-flex items-center justify-center gap-2 rounded-full font-semibold transition-all duration-200 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed';
      const sizes = {
        sm: 'px-4 py-2 text-sm',
        md: 'px-6 py-3 text-sm md:text-base',
        lg: 'px-8 py-4 text-base',
      };
      const variants = {
        primary: 'bg-lime text-grey90 shadow-lg shadow-lime/20 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-lime/30 active:translate-y-0 active:scale-[0.98]',
        outline: 'border border-white/25 bg-white/[0.02] text-white backdrop-blur-sm hover:-translate-y-0.5 hover:border-white/60 hover:bg-white/[0.06]',
        ghost: 'text-white/80 hover:text-white',
        dark: 'bg-grey80 text-white border border-white/10 hover:bg-grey75 hover:-translate-y-0.5',
      };
      return (
        <button className={`${base} ${sizes[size]} ${variants[variant]} ${className}`} {...rest}>
          {children}
        </button>
      );
    }

    // Chevron — drawn rather than set as the "›" glyph, which renders as a thin
    // typographic mark and sits off the optical centre at UI sizes.
    function Chevron({ size = 16, className = '' }) {
      return (
        <svg
          width={size} height={size} viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
          className={`shrink-0 ${className}`} aria-hidden="true"
        >
          <path d="M9 5l7 7-7 7" />
        </svg>
      );
    }

    // Star rating. Drawn rather than set with the ★ glyph because a half star has no
    // glyph — each star's fill is a hard gradient stop at its own fill fraction.
    function Stars({ value = 4.5, size = 11, gap = 2.5, className = '' }) {
      const uid = React.useId().replace(/[^a-zA-Z0-9]/g, '');
      return (
        <span className={`flex items-center ${className}`} style={{ gap }} aria-hidden="true">
          {[0, 1, 2, 3, 4].map((i) => {
            const fill = Math.max(0, Math.min(1, value - i));
            const id = `star-${uid}-${i}`;
            return (
              <svg key={i} width={size} height={size} viewBox="0 0 24 24" className="shrink-0">
                <defs>
                  <linearGradient id={id} x1="0" y1="0" x2="1" y2="0">
                    <stop offset={fill} stopColor="currentColor" />
                    <stop offset={fill} stopColor="currentColor" stopOpacity="0.28" />
                  </linearGradient>
                </defs>
                <path
                  d="M12 1.9l3.09 6.26 6.91 1.01-5 4.87 1.18 6.88L12 17.67l-6.18 3.25L7 14.04 2 9.17l6.91-1.01z"
                  fill={`url(#${id})`}
                />
              </svg>
            );
          })}
        </span>
      );
    }

    // Card wrapper
    function Card({ className = '', children, ...rest }) {
      return (
        <div className={`rounded-3xl ${className}`} {...rest}>{children}</div>
      );
    }

    // LIVE badge
    function LiveBadge() {
      return (
        <span className="inline-flex items-center gap-1 rounded-md bg-live px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-wide text-white">
          <span className="h-1.5 w-1.5 rounded-full bg-white animate-pulse" /> Live
        </span>
      );
    }

    // Reveal-on-scroll wrapper
    function Reveal({ as: Tag = 'div', className = '', children, ...rest }) {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { el.classList.add('kb-in'); obs.unobserve(el); } });
        }, { threshold: 0.12 });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      return <Tag ref={ref} className={`kb-reveal ${className}`} {...rest}>{children}</Tag>;
    }

    // Section container — 1200px rail, matching the design's content width
    function Section({ id, className = '', children }) {
      return (
        <section id={id} className={`mx-auto w-full max-w-[1200px] px-5 sm:px-8 ${className}`}>
          {children}
        </section>
      );
    }

    // Infinite marquee for wordmarks/logos
    function LogoMarquee({ items, dur = '35s' }) {
      const doubled = [...items, ...items];
      return (
        <div className="kb-marquee relative overflow-hidden" aria-hidden="true">
          <div className="kb-marquee-track kb-anim-left" style={{ '--dur': dur }}>
            {doubled.map((label, i) => (
              <span key={i} className="mx-8 select-none whitespace-nowrap text-lg font-semibold uppercase tracking-wide text-grey60 sm:text-xl">
                {label}
              </span>
            ))}
          </div>
        </div>
      );
    }

    // ========================================
    // Data
    // ========================================
    // Brand wordmarks exported from Figma, trimmed to their ink bounds. 20px is the
    // shared height; LG and Fire TV get 26px because their marks are not lettering
    // alone — LG carries a circular badge, Fire TV a smile arc beneath the words — so
    // at a common box height their letters render noticeably smaller than the rest.
    const LOGO_HEIGHT = 20;
    const PLATFORMS = [
      { name: 'Samsung TV', src: 'assets/logo-samsung.png', w: 100 },
      { name: 'LG TV',      src: 'assets/logo-lg.png',     h: 26 },
      { name: 'Roku',       src: 'assets/logo-roku.png',   w: 48 },
      { name: 'Fire TV',    src: 'assets/logo-firetv.png', h: 26 },
      { name: 'VIZIO',      src: 'assets/logo-vizio.png',   w: 80 },
      { name: 'Google TV',  src: 'assets/logo-googletv.png' },
    ];

    // Same six platforms as install links. Heights are smaller than the wordmark row
    // and follow the same rule: pure lettering sits lower, marks-with-glyphs sit higher.
    const PLATFORM_LINKS = [
      { name: 'Samsung TV', src: 'assets/logo-samsung.png',  h: 10,
        href: 'https://www.samsung.com/us/tvs/smart-tv/samsung-tv-apps-detail/?appId=3202303030514' },
      { name: 'LG TV',      src: 'assets/logo-lg.png',       h: 18,
        href: 'https://us.lgappstv.com/main/tvapp/detail?appId=1210925&catCode1=&moreYn=N&cateYn=N&orderType=0&headerName=&appRankCode=&sellrUsrNo=' },
      { name: 'VIZIO',      src: 'assets/logo-vizio.png',    h: 12,
        href: 'https://www.vizio.com/en/smart-tv-apps?appName=bingekorea&appId=vizio.bingekorea' },
      { name: 'Google TV',  src: 'assets/logo-googletv.png', h: 14,
        href: 'https://play.google.com/store/apps/details?id=net.itsnewid.app.android.paro' },
    ];

    // Gradient palette for content thumbnails
    const GRAD = {
      purple: 'linear-gradient(135deg,#3b1a63,#7b2ff7,#d3f47c22)',
      sky:    'linear-gradient(135deg,#1b3a5c,#2f80c9,#7fd0ff33)',
      rose:   'linear-gradient(135deg,#5c1b3a,#c9407e,#ffd0e033)',
      slate:  'linear-gradient(135deg,#1c2b26,#3c4c44,#d3f47c22)',
      amber:  'linear-gradient(135deg,#5c3a1b,#c98b2f,#ffe6b033)',
      teal:   'linear-gradient(135deg,#123a36,#1f8a7a,#7ffce033)',
      indigo: 'linear-gradient(135deg,#1a2363,#4a52d6,#c9d0ff33)',
      green:  'linear-gradient(135deg,#12401f,#2f9d4a,#c9ffd033)',
    };

    // Channel thumbnails from the Kbingers library. Titles follow the artwork; the
    // second line is the genre.
    const ROW1 = [
      { title: 'NEW KPOP',        sub: 'K-Pop', img: 'assets/channels/new-kpop.jpg' },
      { title: 'NEW KMOVIES',     sub: 'Movies',         img: 'assets/channels/new-kmovies.jpg' },
      { title: 'NEW KFOOD',       sub: 'Food · Lifestyle',          img: 'assets/channels/new-kfood.jpg' },
      { title: 'JTBC News',       sub: 'News',         img: 'assets/channels/jtbc-news.jpg' },
      { title: 'YG TV',           sub: 'K-Pop · Entertainment',     img: 'assets/channels/yg-tv.jpg' },
      { title: 'K-ASMR',          sub: 'ASMR · Relaxation',            img: 'assets/channels/k-asmr.jpg' },
    ];
    const ROW2 = [
      { title: 'Show Champion',   sub: 'K-Pop · Music',          img: 'assets/channels/show-champion.jpg' },
      { title: 'Weekly Idol',     sub: 'Variety',             img: 'assets/channels/weekly-idol.jpg' },
      { title: 'The Heirs',       sub: 'Romance · Drama',           img: 'assets/channels/the-heirs.jpg' },
      { title: 'Boys Over Flowers', sub: 'Romance · Drama',         img: 'assets/channels/boys-over-flowers.jpg' },
      { title: 'Playful Kiss',    sub: 'Romance · Comedy',           img: 'assets/channels/playful-kiss.jpg' },
      { title: 'The Package',     sub: 'Romance · Drama',          img: 'assets/channels/the-package.jpg' },
    ];
    const ROW3 = [
      { title: 'WAIKIKI 2',       sub: 'Comedy · Variety',          img: 'assets/channels/waikiki.jpg' },
      { title: 'Agency',          sub: 'Drama',            img: 'assets/channels/agency.jpg' },
      { title: 'The Good Detective', sub: 'Crime · Thriller',       img: 'assets/channels/good-detective.jpg' },
      { title: 'Misty',           sub: 'Mystery · Thriller',       img: 'assets/channels/misty.jpg' },
      { title: 'When the Weather Is Fine', sub: 'Romance · Drama',    img: 'assets/channels/when-the-weather.jpg' },
      { title: 'Robocar Poli',    sub: 'Kids · Animation',          img: 'assets/channels/robocar-poli.jpg' },
    ];

    const FAQS = [
      { q: 'What is Kbingers?', a: 'Kbingers is a 24/7 premium Korean-content FAST/AVOD streaming platform. Enjoy K-dramas, K-movies, K-pop, variety shows and K-food across live curated channels and an on-demand library — Korean TV all day, everyday, all free.' },
      { q: 'Is Kbingers really free?', a: 'Yes. Kbingers is 100% free. There is no subscription, no signup and no credit card required. The service is ad-supported (FAST/AVOD), so you can start watching instantly at no cost.' },
      { q: 'Where is Kbingers available?', a: 'Kbingers is available across major connected-TV platforms and streaming devices in supported regions, including Samsung TV, LG TV, Roku, Amazon Fire TV, VIZIO and Google TV.' },
      { q: 'Where can I watch Kbingers?', a: 'You can watch on your Smart TV or streaming device through the Kbingers app, or from any browser at bingekorea.tv. Pick a live channel to lean back, or browse on demand to choose exactly what you want.' },
      { q: 'How do I download Kbingers?', a: 'Search "Kbingers" in your TV platform’s app store (Samsung, LG, Roku, Fire TV, VIZIO or Google TV) and install it — or use 1-Click Install to send the app straight to your TV from your phone in minutes.' },
      { q: 'How do I save my favorite content?', a: 'Browse the on-demand library and add titles to your favorites to build a personal watchlist. Your picks are kept handy so you can jump back into a show or movie anytime.' },
      { q: 'Contact Us', a: 'Need help or have a partnership inquiry? Reach out to NEW ID Co., Ltd. through the contact channels on bingekorea.tv or our social accounts — we are always here to help.' },
    ];

    // ========================================
    // 🧩 LAYOUT — Header
    // ========================================
    const NAV_LINKS = [
      { label: 'NEW ID', href: 'https://www.its-newid.com/' },
      { label: '1-Click Install', href: '#install' },
      { label: 'Explore', href: '#how-to-watch' },
      { label: 'Service', href: '#service' },
      { label: 'FAQ', href: '#faq' },
    ];

    function Wordmark({ className = '' }) {
      return (
        <a href="#top" className={`font-extrabold italic tracking-tight ${className}`} aria-label="Kbingers home">
          <span className="text-lime">K</span><span className="text-white">bingers</span>
        </a>
      );
    }

    function Header() {
      const [scrolled, setScrolled] = useState(false);
      const [open, setOpen] = useState(false);
      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 20);
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return (
        <header className={`fixed inset-x-0 top-0 z-50 transition-colors duration-300 ${scrolled ? 'bg-grey90/85 backdrop-blur-md' : 'bg-transparent'}`}>
          {/* Hairline sits inside the max-width rail, matching the design */}
          <nav className="mx-auto flex max-w-[1200px] items-center justify-between border-b border-white/15 px-5 py-4 sm:px-8">
            <a href="#top" aria-label="Kbingers home" className="inline-flex items-center">
              <img src="assets/logo-kbingers.png" alt="Kbingers" className="h-auto w-[90px]" />
            </a>
            <div className="hidden items-center gap-8 md:flex">
              {NAV_LINKS.map((l) => (
                <a
                  key={l.label}
                  href={l.href}
                  {...(/^https?:/.test(l.href) ? { target: '_blank', rel: 'noopener noreferrer' } : {})}
                  className="text-sm font-medium text-grey10/90 transition-colors hover:text-lime"
                >
                  {l.label}
                </a>
              ))}
            </div>
            <button
              className="md:hidden text-white"
              aria-label="Toggle menu"
              aria-expanded={open}
              onClick={() => setOpen((v) => !v)}
            >
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                {open ? <><path d="M6 6l12 12" /><path d="M18 6L6 18" /></> : <><path d="M4 7h16" /><path d="M4 12h16" /><path d="M4 17h16" /></>}
              </svg>
            </button>
          </nav>
          {open && (
            <div className="md:hidden border-t border-white/10 bg-grey90/95 backdrop-blur-md">
              <div className="flex flex-col px-5 py-3">
                {NAV_LINKS.map((l) => (
                  <a
                    key={l.label}
                    href={l.href}
                    onClick={() => setOpen(false)}
                    {...(/^https?:/.test(l.href) ? { target: '_blank', rel: 'noopener noreferrer' } : {})}
                    className="py-3 text-sm font-medium text-grey10/90 hover:text-lime"
                  >
                    {l.label}
                  </a>
                ))}
              </div>
            </div>
          )}
        </header>
      );
    }

    // ========================================
    // 📄 Hero
    // ========================================
    // ⭐ App-store rating — laurel wreath flanking the score, per the design
    function RatingBadge() {
      return (
        <div className="flex flex-col items-center">
          <div className="flex items-center justify-center gap-1.5">
            <img src="assets/laurel-left.png" alt="" aria-hidden="true" className="h-[52px] w-auto opacity-80 sm:h-[62px]" />
            <div className="flex flex-col items-center px-1">
              <span className="text-[28px] font-semibold leading-[0.9] text-white sm:text-[33px]">4.5</span>
              <Stars value={4.5} size={11} className="mt-[7px] text-white" />
            </div>
            <img src="assets/laurel-right.png" alt="" aria-hidden="true" className="h-[52px] w-auto opacity-80 sm:h-[62px]" />
          </div>
          {/* Sits under the whole wreath rather than inside it — the laurels leave too
              little width between them for a line this long. */}
          <span className="mt-[10px] text-[10px] font-light leading-none tracking-[0.04em] text-white/55 sm:text-[11px]">
            Based on Viewer Feedback
          </span>
          <span className="sr-only">Rated 4.5 out of 5, based on viewer feedback</span>
        </div>
      );
    }

    // Wall of K-content behind the hero, as in the design: real poster artwork,
    // sharp at the edges and softened through the middle, under a heavy scrim.
    function HeroBackdrop() {
      return (
        <div className="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
          {/* a repeating pattern, so it crops gracefully at any aspect — no phone-specific
              framing needed */}
          <div
            className="absolute inset-0 bg-cover bg-center"
            style={{ backgroundImage: "url('assets/hero-bg.jpg')" }}
          />
          {/* The design has a 680px margin either side of its 1200px rail, so the wall
              reads there. At normal widths there is no such margin — so instead of a
              full-field scrim, pool the darkness behind the headline and let the
              posters carry everywhere else. */}
          <div
            className="absolute inset-0"
            style={{
              backgroundColor: 'rgba(16,22,14,0.62)',
              background: [
                'radial-gradient(52% 38% at 50% 30%, rgba(16,22,14,0.88), rgba(16,22,14,0) 74%)',
                'linear-gradient(to top, #10160E 0%, rgba(16,22,14,0) 42%)',
                'linear-gradient(to bottom, rgba(16,22,14,0.85) 0%, rgba(16,22,14,0.45) 30%)',
                'linear-gradient(rgba(16,22,14,0.62), rgba(16,22,14,0.62))',
              ].join(', '),
            }}
          />
          <div className="absolute inset-x-0 bottom-0 h-40" style={{ background: 'linear-gradient(to top,#10160E,transparent)' }} />
        </div>
      );
    }

    // TEMPORARY card artwork. Real photography is coming — when it lands, replace this
    // whole component with a single <img className="absolute inset-0 h-full w-full
    // object-cover" /> and nothing else in InstallCard needs to change.
    function CardPlaceholder({ tint }) {
      return (
        <div className="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
          <div className="absolute inset-0" style={{ background: tint }} />
        </div>
      );
    }

    // Platform install card — copy up top, brand CTA, artwork filling the card
    function InstallCard({ platform, cta, logo, logoHeight, brandBg, brandFg, tint, href = '#install' }) {
      const external = /^https?:/.test(href);
      return (
        <a
          href={href}
          {...(external ? { target: '_blank', rel: 'noopener noreferrer' } : {})}
          className="group relative flex h-[268px] flex-col items-center overflow-hidden rounded-[20px] border border-white/15 bg-grey90 px-5 pt-11 transition-colors duration-200 hover:border-white/35 sm:h-[344px] sm:pt-14"
        >
          <div className="absolute inset-0 transition-transform duration-500 group-hover:scale-[1.03]">
            <CardPlaceholder tint={tint} />
          </div>
          {/* Scrim runs from the very top so the copy sits on solid dark and the
              artwork emerges lower down */}
          <span
